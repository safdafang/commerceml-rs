[workspace]
resolver = "3"
members = ["crates/commerceml", "crates/commerceml-cli"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/safdafang/commerceml-rs"
homepage = "https://github.com/safdafang/commerceml-rs"
keywords = ["commerceml", "1c", "xml", "ecommerce", "parser"]
categories = ["parser-implementations", "encoding", "web-programming"]

[workspace.dependencies]
commerceml = { path = "crates/commerceml", version = "0.1.0" }

quick-xml = "0.42"
encoding_rs = "0.8.44"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
doc_markdown = "allow"

[profile.bench]
debug = true
