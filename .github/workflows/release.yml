# Publishes to crates.io with Trusted Publishing (no API token).
#
# Runs ONLY when a GitHub release is published. Publishing additionally waits
# for approval of the "crates-io" environment (Settings → Environments →
# crates-io → Required reviewers). See CONTRIBUTING.md, "Releasing".
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  binaries:
    name: CLI binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p commerceml-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="commerceml-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/commerceml${{ matrix.ext }}" "$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name"
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber

  publish:
    name: Publish to crates.io
    needs: binaries
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/commerceml
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: |
          cargo publish --locked -p commerceml
          cargo publish --locked -p commerceml-exchange
          cargo publish --locked -p commerceml-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
